name: Makefile CI

on:
  push:
    branches: [ "malmo_g-user-14-U3UOS34.49-40-2-72faeb-release-keys" ]
  pull_request:
    branches: [ "malmo_g-user-14-U3UOS34.49-40-2-72faeb-release-keys" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./configure

    - name: Install dependencies
      run: make

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
